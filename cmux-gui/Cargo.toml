[package]
name = "cmux-gui"
version = "0.1.0"
edition = "2021"
description = "Native cmux GUI (GPUI) — drives cmux-tui over cmux.protocol/2"

[workspace]

[dependencies]
gpui = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
smol = "2"
futures-lite = "2"

# glibc lacks ENOATTR; xattr 0.2.3 (via zed-async-tar) references it directly.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
